# Copy to agent.yaml. Export variables in the process environment before starting;
# the application does not automatically load config/.env.
server:
  port: 8080
  # Empty keeps the legacy :port listener. For local console use 127.0.0.1:8080;
  # direct LAN access requires an explicit LAN address or 0.0.0.0:8080.
  listen_address: ""
  internal_key: "${AGENT_INTERNAL_KEY}"
  shutdown_timeout: 10s
  chain_timeout: 300s
  search_timeout: 30s

# Console is local, optional, and uses its own accounts/cookies.
# Keep data_dir outside both Vault roots and the ./static directory.
# See docs/console-local-setup.md for initialization with a password prompt.
console:
  enabled: false
  data_dir: "./data/console"
  public_origin: "http://127.0.0.1:8080"
  allow_insecure_http: false

inference:
  endpoint: "http://localhost:11434"
  models:
    local: "gemma4:12b"
    vision: "llava:7b"
    embedding: "bge-m3"
  timeout: 300s

vaults:
  personal: "${PERSONAL_VAULT_PATH}"
  agent: "${AGENT_VAULT_PATH}"

retrieval:
  rrf_k: 60
  top_k: 5
  max_chunk_chars: 800
  search_timeout: 30s

session:
  max_rounds: 20
  idle_timeout: 30m
  scan_interval: 1m
  max_sessions: 100

memory:
  dedup_threshold: 0.45
  min_messages: 3

personality:
  enabled: false
  name: ""
  tone: "neutral"
  system_prompt: ""

channels:
  wecom:
    enabled: false
    config:
      listen_addr: ":8081"
      corp_id: "${WECOM_CORP_ID}"
      corp_secret: "${WECOM_CORP_SECRET}"
      agent_id: "${WECOM_AGENT_ID}"
      token: "${WECOM_CALLBACK_TOKEN}"
      encoding_aes_key: "${WECOM_AES_KEY}"
      allowed_users: []
      auto_approve: false

smarthome:
  enabled: false
  base_url: "http://localhost:8123"
  # Alternative to token: an existing protected HA OAuth grant JSON file.
  oauth_credentials_file: ""
  token: "${HA_ACCESS_TOKEN}"
  poll_interval_sec: 3600
  analysis_hour: 3
  # Optional expectation check only; HA /api/config.time_zone is authoritative.
  # A mismatch blocks time suggestions and confirmation until resolved.
  time_zone: ""
  # Chat controls are opt-in and require the authenticated Console.
  control:
    enabled: false
    proposal_ttl: 120s
    readback_timeout: 10s
    readback_interval: 500ms
    retention: 720h
    max_records: 10000
    targets: []
    # Replace with a physically verified low-risk load; never copy this entity ID.
    # targets:
    #   - entity_id: light.example_verified_load
    #     name: "客厅台灯"
    #     area_name: "客厅"
    #     aliases: ["阅读灯"]
    #     allowed_actions: ["turn_on", "turn_off"]
    #     load_location_verified: true

logging:
  level: "info"
  format: "console"
